<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

      :root {
        --primary-color: #2563eb;
        --background-color: #f8fafc;
        --text-color: #1e293b;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        text-align: center;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--background-color);
        color: var(--text-color);
        padding: 20px;
      }

      .container {
        max-width: 600px;
        width: 100%;
        padding: 40px;
        background-color: white;
        border-radius: 16px;
        box-shadow:
          0 4px 6px -1px rgb(0 0 0 / 0.1),
          0 2px 4px -2px rgb(0 0 0 / 0.1);
        animation: slideUp 0.5s ease-out;
      }

      .icon {
        font-size: 64px;
        margin-bottom: 24px;
        animation: pulse 2s infinite;
      }

      h1 {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 16px;
        color: var(--primary-color);
      }

      p {
        font-size: 1.1em;
        line-height: 1.6;
        color: #64748b;
        margin-bottom: 12px;
      }

      .retry-button {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 24px;
        background-color: var(--primary-color);
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 500;
        transition:
          transform 0.2s,
          background-color 0.2s;
      }

      .retry-button:hover {
        transform: translateY(-2px);
        background-color: #1d4ed8;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>You're Offline</h1>
      <p>Looks like you've lost your connection to the internet.</p>
      <a href="/" class="retry-button">Try Again</a>
    </div>
  </body>
</html>
