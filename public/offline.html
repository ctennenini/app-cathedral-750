<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 20px;
        background-color: #f0f0f0;
        color: #333;
      }
      h1 {
        color: #555;
      }
      p {
        font-size: 1.1em;
      }
      .container {
        max-width: 600px;
        margin: 50px auto;
        padding: 30px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>You are Offline</h1>
      <p>It looks like you're not connected to the internet. Don't worry, some content may still be available.</p>
      <p>Please check your connection and try again.</p>
    </div>
  </body>
</html>
