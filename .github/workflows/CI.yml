name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    # the deploy step pushes the built site to the gh-pages branch, which needs write access
    permissions:
      contents: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: yarn

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        env:
          PREFIX: /${{ github.event.repository.name }}
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: yarn build

      - name: Build Storybook
        env:
          PREFIX: /${{ github.event.repository.name }}/storybook
        run: yarn build-storybook -o out/components

      - name: Create .nojekyll
        run: touch ./out/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          branch: gh-pages
          folder: out
