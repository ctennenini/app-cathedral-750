name: Build and Deploy

on:
  push:
    branches:
      - main

  # "Run workflow" button in the Actions tab, e.g. to publish after uploading a new video
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    # the deploy step pushes the built site to the gh-pages branch, which needs write access
    permissions:
      contents: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: yarn

      # videos are too big for git: they're attached to the "videos" release and downloaded here (see README)
      - name: Download videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download videos --repo "${{ github.repository }}" --pattern '*.mp4' --dir public/videos --clobber; then
            ls -l public/videos
          else
            echo "::warning::No 'videos' release found in ${{ github.repository }}, building without videos"
          fi

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        env:
          PREFIX: /${{ github.event.repository.name }}
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: yarn build

      - name: Build Storybook
        env:
          PREFIX: /${{ github.event.repository.name }}/storybook
        run: yarn build-storybook -o out/components

      - name: Create .nojekyll
        run: touch ./out/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          branch: gh-pages
          folder: out
          # keep only the latest deploy, so the videos don't pile up in the branch's history
          single-commit: true
