name: Build and Deploy

on:
  push:
    branches:
      - main

  # "Run workflow" button in the Actions tab, e.g. to publish after uploading a new video
  workflow_dispatch:

# only one deploy at a time; a newer one replaces a deploy that hasn't started yet
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    # the site is uploaded straight to GitHub Pages (not pushed to a branch, where GitHub refuses files
    # over 100 MB, like some of the videos)
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: yarn

      # videos are too big for git: they're attached to the "videos" release and downloaded here (see README)
      - name: Download videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download videos --repo "${{ github.repository }}" --pattern '*.mp4' --dir public/videos --clobber; then
            ls -l public/videos
          else
            echo "::warning::No 'videos' release found in ${{ github.repository }}, building without videos"
          fi

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        env:
          PREFIX: /${{ github.event.repository.name }}
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: yarn build

      - name: Build Storybook
        env:
          PREFIX: /${{ github.event.repository.name }}/storybook
        # Storybook copies the whole public/ folder, videos included; the app already has them
        run: |
          yarn build-storybook -o out/components
          rm -rf out/components/videos

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
